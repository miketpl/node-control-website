# Not the Spark path. api.nodecontrol.io reaches gunicorn through a
# Cloudflare tunnel, so the peer is 127.0.0.1. The app trusts
# CF-Connecting-IP only from loopback. This file is the old recipe
# for a box where nginx faces the internet directly. Do not add a
# Cloudflare IP-range allow list.

server {
    listen 80;
    server_name api.nodecontrol.io;

    # Certbot will add the HTTPS redirect + SSL blocks
    # Run: sudo certbot --nginx -d api.nodecontrol.io

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS preflight handled by Flask-CORS, but let OPTIONS through
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Health check shortcut (optional — useful for uptime monitors)
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
